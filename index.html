<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpeg" href="img/logo.jpg">

<title>Escolha seu atendimento</title>

<style>
    /* ================================
       RESET
    ================================= */

    *,
    *::before,
    *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    /* ================================
       VARIÁVEIS
    ================================= */

    :root {
        --verde: #238b4d;
        --verde-escuro: #176b3a;

        --whatsapp: #25d366;
        --whatsapp-escuro: #16a34a;

        --texto: #17201a;
        --texto-secundario: #66736b;

        --raio-card: 24px;
        --raio-botao: 15px;

        --sombra-card:
            0 25px 70px rgba(0, 0, 0, 0.25);

        --transicao:
            0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ================================
       BODY
    ================================= */

    body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        color: var(--texto);

        background:
            linear-gradient(
                135deg,
                rgba(10, 35, 20, 0.78),
                rgba(0, 0, 0, 0.48)
            ),
            url("img/fundo.jpg") center / cover no-repeat fixed;

        position: relative;
        overflow-x: hidden;
    }

    /* ================================
       EFEITOS DO FUNDO
    ================================= */

    body::before {
        content: "";

        position: fixed;

        width: 420px;
        height: 420px;

        top: -180px;
        right: -150px;

        background: rgba(37, 211, 102, 0.18);

        border-radius: 50%;

        filter: blur(80px);

        pointer-events: none;
    }

    body::after {
        content: "";

        position: fixed;

        width: 350px;
        height: 350px;

        bottom: -180px;
        left: -150px;

        background: rgba(35, 139, 77, 0.18);

        border-radius: 50%;

        filter: blur(80px);

        pointer-events: none;
    }

    /* ================================
       CARD
    ================================= */

    .card {
        position: relative;
        z-index: 1;

        width: 100%;
        max-width: 470px;

        padding: 42px 36px 34px;

        background: rgba(255, 255, 255, 0.97);

        border: 1px solid rgba(255, 255, 255, 0.7);

        border-radius: var(--raio-card);

        box-shadow: var(--sombra-card);

        text-align: center;

        animation:
            cardEntrada 0.65s
            cubic-bezier(0.2, 0.8, 0.2, 1)
            both;
    }

    @keyframes cardEntrada {
        from {
            opacity: 0;
            transform: translateY(25px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    /* ================================
       LOGO
    ================================= */

    .logo-container {
        display: flex;
        justify-content: center;

        margin-bottom: 22px;
    }

    .logo {
        width: 88px;
        height: 88px;

        object-fit: cover;

        border-radius: 50%;

        border: 4px solid #ffffff;

        box-shadow:
            0 8px 25px rgba(0, 0, 0, 0.15);

        background: #f5f5f5;
    }

    /* ================================
       TÍTULO
    ================================= */

    h1 {
        font-size: clamp(1.45rem, 5vw, 1.8rem);

        font-weight: 750;

        letter-spacing: -0.5px;

        line-height: 1.2;

        color: var(--texto);

        margin-bottom: 11px;
    }

    .descricao {
        max-width: 350px;

        margin: 0 auto 30px;

        color: var(--texto-secundario);

        font-size: 0.98rem;

        line-height: 1.55;
    }

    /* ================================
       OPÇÕES
    ================================= */

    .opcoes {
        display: flex;
        flex-direction: column;

        gap: 14px;
    }

    /* ================================
       BOTÕES
    ================================= */

    .botao {
        position: relative;

        width: 100%;
        min-height: 68px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 13px;

        padding: 15px 22px;

        border: none;
        border-radius: var(--raio-botao);

        color: #ffffff;

        font-family: inherit;

        font-size: 1.02rem;
        font-weight: 700;

        text-decoration: none;

        cursor: pointer;

        overflow: hidden;

        transition:
            transform var(--transicao),
            box-shadow var(--transicao),
            filter var(--transicao);
    }

    /* Brilho do botão */

    .botao::before {
        content: "";

        position: absolute;

        inset: 0;

        background:
            linear-gradient(
                120deg,
                rgba(255, 255, 255, 0.13),
                transparent 45%
            );

        pointer-events: none;
    }

    .botao:hover {
        transform: translateY(-3px);

        filter: brightness(1.04);
    }

    .botao:active {
        transform: translateY(0) scale(0.985);
    }

    .botao:focus-visible {
        outline: 3px solid rgba(35, 139, 77, 0.25);

        outline-offset: 3px;
    }

    /* ================================
       ÍCONE
    ================================= */

    .icone {
        width: 42px;
        height: 42px;

        display: flex;
        align-items: center;
        justify-content: center;

        flex-shrink: 0;

        border-radius: 12px;

        background: rgba(255, 255, 255, 0.15);

        font-size: 1.35rem;
    }

    /* ================================
       TEXTO DO BOTÃO
    ================================= */

    .texto-botao {
        flex: 1;

        text-align: left;
    }

    .texto-botao strong {
        display: block;

        font-size: 1.03rem;

        line-height: 1.3;
    }

    .texto-botao small {
        display: block;

        margin-top: 3px;

        font-size: 0.78rem;

        font-weight: 500;

        opacity: 0.82;
    }

    /* ================================
       SETA
    ================================= */

    .seta {
        font-size: 1.5rem;

        line-height: 1;

        opacity: 0.75;

        transition:
            transform var(--transicao);
    }

    .botao:hover .seta {
        transform: translateX(4px);
    }

    /* ================================
       BOTÃO SITE
    ================================= */

    .site {
        background:
            linear-gradient(
                135deg,
                var(--verde),
                var(--verde-escuro)
            );

        box-shadow:
            0 8px 20px rgba(35, 139, 77, 0.28);
    }

    .site:hover {
        box-shadow:
            0 12px 28px rgba(35, 139, 77, 0.40);
    }

    /* ================================
       BOTÃO WHATSAPP
    ================================= */

    .whatsapp {
        background:
            linear-gradient(
                135deg,
                var(--whatsapp),
                var(--whatsapp-escuro)
            );

        box-shadow:
            0 8px 20px rgba(37, 211, 102, 0.25);
    }

    .whatsapp:hover {
        box-shadow:
            0 12px 28px rgba(37, 211, 102, 0.38);
    }

    /* ================================
       DIVISOR
    ================================= */

    .divisor {
        display: flex;

        align-items: center;

        gap: 12px;

        margin: 23px 0 20px;

        color: #9aa49e;

        font-size: 0.72rem;

        font-weight: 600;

        text-transform: uppercase;

        letter-spacing: 0.8px;
    }

    .divisor::before,
    .divisor::after {
        content: "";

        height: 1px;

        flex: 1;

        background: #e4e8e5;
    }

    /* ================================
       RODAPÉ
    ================================= */

    .rodape {
        color: #8a948e;

        font-size: 0.78rem;

        line-height: 1.4;
    }

    /* ================================
       RESPONSIVIDADE
    ================================= */

    @media (max-width: 520px) {

        body {
            padding: 16px;
        }

        .card {
            padding: 32px 20px 26px;

            border-radius: 21px;
        }

        .logo {
            width: 76px;
            height: 76px;
        }

        h1 {
            font-size: 1.45rem;
        }

        .descricao {
            font-size: 0.92rem;

            margin-bottom: 24px;
        }

        .botao {
            min-height: 64px;

            padding: 13px 16px;
        }

        .icone {
            width: 38px;
            height: 38px;
        }

        .texto-botao strong {
            font-size: 0.96rem;
        }

        .texto-botao small {
            font-size: 0.74rem;
        }
    }

    /* ================================
       ACESSIBILIDADE
    ================================= */

    @media (prefers-reduced-motion: reduce) {

        *,
        *::before,
        *::after {
            animation: none !important;
            transition: none !important;
        }
    }
</style>

</head> <body>
<main class="card">

    <div class="logo-container">
        <img
            src="img/logo.jpg"
            alt="Logo"
            class="logo"
        >
    </div>

    <h1>
        Como deseja ser atendido?
    </h1>

    <p class="descricao">
        Escolha uma das opções abaixo para realizar seu pedido.
    </p>

    <div class="opcoes">

        <!-- ==========================================
             BOTÃO 1 — SITE
        =========================================== -->

        <a
            href="pedir.html"
            class="botao site"
            aria-label="Montar pedido pelo site"
        >

            <span class="icone">
                🌐
            </span>

            <span class="texto-botao">
                <strong>Monte pelo site</strong>

                <small>
                    Monte seu pedido de forma rápida e fácil
                </small>
            </span>

            <span class="seta">
                ›
            </span>

        </a>


        <!-- ==========================================
             BOTÃO 2 — WHATSAPP
        =========================================== -->

        <button
            type="button"
            class="botao whatsapp"
            onclick="abrirWhatsAppDireto()"
            aria-label="Pedir pelo WhatsApp"
        >

            <span class="icone">
                💬
            </span>

            <span class="texto-botao">
                <strong>Pedir pelo WhatsApp</strong>

                <small>
                    Fale diretamente com nosso atendimento
                </small>
            </span>

            <span class="seta">
                ›
            </span>

        </button>

    </div>

    <div class="divisor">
        <span>
            Escolha uma opção
        </span>
    </div>

    <p class="rodape">
        Atendimento rápido, simples e seguro.
    </p>

</main>


<!-- JavaScript -->
<script src="app.js"></script>

</body> </html>
