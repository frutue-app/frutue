<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutue - Painel de Controle</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 800px; margin: 20px auto; padding: 0 15px; font-family: sans-serif; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #ddd; }
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(22px); }
    .sec-header { background: #f4f4f4; padding: 10px; margin-top: 20px; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="admin-container">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>Painel de Estoque e Produtos</h1>
      <a href="index.html" style="text-decoration:none; background:#666; color:white; padding:8px 15px; border-radius:5px;">⬅ Voltar ao Cardápio</a>
    </div>
    
    <div id="adminCategoriasContainer">
      <!-- Gerado via JavaScript -->
    </div>

    <h1 style="margin-top: 30px;">Preços e Configurações</h1>
    <div id="adminPrecosContainer">
      <!-- Gerado via JavaScript -->
    </div>
  </div>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
