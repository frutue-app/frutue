<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutue - Painel de Controle</title>
  <link rel="icon" type="image/jpeg" href="img/logo.jpg">
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid var(--border); }
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #2e7d32; }
    input:checked + .slider:before { transform: translateX(22px); }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <img src="img/logo.jpg" alt="Frutue Logo" class="header-logo">
      <div class="header-text">
        <h1>Painel do Admin</h1>
        <p>Gerenciamento de Estoque Diário</p>
      </div>
    </div>
    <div class="header-actions">
      <a href="index.html" class="btn-secondary" style="text-decoration:none;">⬅ Ver Cardápio</a>
    </div>
  </header>

  <main class="admin-container">

    <section class="card-section">
      <div class="section-title">
        <h2>🍓 Frutas Disponíveis Hoje</h2>
      </div>
      <div id="adminFrutasList">
        <!-- Gerado via JavaScript -->
      </div>
    </section>

    <section class="card-section" style="margin-top: 20px;">
      <div class="section-title">
        <h2>🥪 Produtos e Categorias</h2>
      </div>
      <div id="adminProdutosList">
        <!-- Gerado via JavaScript -->
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
